services:
  postgres:
    image: postgres:16-alpine
    container_name: allo-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: allo_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - allo_bank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allo_bank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  allo_bank_postgres_data: